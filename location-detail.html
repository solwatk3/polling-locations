<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location Detail - TN Polling Locations</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* =================================================================
       CSS VARIABLES - matches the dark theme in css/style.css
       ================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #1a001a;
      --primary-light: #3b0a5c;
      --accent:        #9b30ff;
      --accent-light:  #b96aff;
      --bg:            #0d0d0d;
      --surface:       #1a0a1a;
      --surface-2:     #220f22;
      --text:          #ffffff;
      --text-muted:    #c4b0e0;
      --border:        #4a2e6a;
      --success:       #22c55e;
      --warning:       #f59e0b;
      --danger:        #ef4444;
      --info:          #60a5fa;
      --topbar-height: 56px;
      --radius:        8px;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* no page scroll - each panel scrolls independently */
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* =================================================================
       TOP BAR
       ================================================================= */
    .top-bar {
      height: var(--topbar-height);
      background: var(--primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-back:hover { color: var(--text); border-color: var(--accent); }

    .top-bar-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .top-bar-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      transition: color 0.15s, background 0.15s;
    }
    .top-nav-link:hover     { color: var(--text); background: var(--primary-light); }
    .top-nav-link.active    { color: var(--accent-light); background: rgba(155,48,255,0.15); }

    /* =================================================================
       MAIN LAYOUT: map left, info right
       Below the top bar, fills the remaining viewport height.
       ================================================================= */
    .detail-layout {
      display: flex;
      height: calc(100vh - var(--topbar-height));
      overflow: hidden;
    }

    /* ----- LEFT: MAP ----- */
    .detail-map-pane {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    #detail-map {
      width: 100%;
      height: 100%;
      background: #12001e;
    }

    /* Small "drag to adjust" hint overlay on top of the map */
    .map-drag-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26,0,26,0.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 5px 14px;
      pointer-events: none;
      z-index: 500;
      white-space: nowrap;
      transition: opacity 0.4s;
    }
    .map-drag-hint.hidden { opacity: 0; }

    /* ----- RIGHT: INFO PANEL ----- */
    .detail-info-pane {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }

    .detail-info-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .detail-info-scroll::-webkit-scrollbar { width: 4px; }
    .detail-info-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Location name + type badge at the top */
    .detail-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .type-badge.early    { background: #064e3b; color: #6ee7b7; }
    .type-badge.eday     { background: #78350f; color: #fde68a; }
    .type-badge.custom   { background: #3b0a5c; color: var(--accent-light); }

    /* Divider line between sections */
    .detail-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0;
    }

    /* Each info row */
    .detail-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-label {
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .detail-value {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.45;
    }
    .detail-value.muted { color: var(--text-muted); font-style: italic; }

    /* District chips */
    .dist-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .dist-chip {
      background: var(--primary-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .dist-chip .chip-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-light);
    }
    .dist-chip .chip-num {
      font-size: 0.9rem;
      color: var(--text);
    }

    /* Coords display */
    .coords-value {
      font-family: "Courier New", monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 10px;
      margin-top: 2px;
    }

    /* Save coords confirmation message */
    #coords-saved-msg {
      font-size: 0.72rem;
      color: var(--success);
      display: none;
      margin-top: 4px;
    }

    /* =================================================================
       FOOTER - action buttons pinned to the bottom of the info pane
       ================================================================= */
    .detail-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-primary {
      flex: 1;
      padding: 9px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--accent-light); }

    .btn-secondary {
      padding: 9px 16px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-secondary:hover { background: var(--primary-light); color: var(--text); }

    .btn-danger {
      padding: 9px 14px;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.15); }

    /* =================================================================
       NOT FOUND STATE
       ================================================================= */
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .not-found .icon { font-size: 3rem; }
    .not-found h2 { color: var(--text); font-size: 1.1rem; }
    .not-found p  { font-size: 0.85rem; line-height: 1.6; }

    /* =================================================================
       RESPONSIVE - stack on narrow screens
       ================================================================= */
    @media (max-width: 680px) {
      .detail-layout { flex-direction: column; overflow-y: auto; }
      .detail-map-pane { height: 55vw; min-height: 220px; flex: none; }
      .detail-info-pane { width: 100%; border-left: none; border-top: 1px solid var(--border); }
      html, body { overflow: auto; }
    }

    /* =================================================================
       EDIT PANEL - slide-in from right, over the layout
       ================================================================= */
    .panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 900;
    }
    .panel-overlay.visible { display: block; }
    .edit-panel {
      position: fixed;
      top: var(--topbar-height);
      right: 0;
      bottom: 0;
      width: 380px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      box-shadow: -4px 0 24px rgba(0,0,0,0.6);
    }
    .edit-panel.open { transform: translateX(0); }
    .ep-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: var(--primary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ep-header h3 { font-size: 0.88rem; font-weight: 700; color: var(--accent); }
    .ep-close {
      background: none; border: none; color: var(--text-muted);
      font-size: 1rem; cursor: pointer; padding: 2px 8px; border-radius: 4px;
    }
    .ep-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .ep-body {
      flex: 1; overflow-y: auto; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 11px;
    }
    .ep-body::-webkit-scrollbar { width: 4px; }
    .ep-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .ep-footer {
      display: flex; gap: 8px; padding: 14px 18px;
      border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .fp-group { display: flex; flex-direction: column; gap: 4px; }
    .fp-group label {
      font-size: 0.64rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-muted);
    }
    .fp-group input, .fp-group select, .fp-group textarea {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-family: inherit;
      font-size: 0.82rem; padding: 7px 10px; outline: none; transition: border-color 0.15s;
    }
    .fp-group input:focus, .fp-group select:focus, .fp-group textarea:focus { border-color: var(--accent); }
    .fp-group select option { background: var(--surface); }
    .fp-group textarea { resize: vertical; min-height: 54px; }
    .fp-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .fp-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .type-radios { display: flex; gap: 8px; }
    .type-radio {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 7px; border: 2px solid var(--border); border-radius: var(--radius);
      cursor: pointer; font-size: 0.78rem; color: var(--text-muted);
      transition: all 0.15s; gap: 5px; user-select: none;
    }
    .type-radio input { display: none; }
    .type-radio.sel-early    { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.1); }
    .type-radio.sel-election { border-color: var(--warning); color: var(--warning); background: rgba(245,158,11,0.1); }
    .inline-status { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; display: none; }
    @media (max-width: 640px) { .edit-panel { width: 100%; } }
  </style>
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="top-bar">
    <div class="top-bar-left">
      <a href="directory.html" class="btn-back">&#8592; Directory</a>
      <div class="top-bar-title" id="page-title">Location Detail</div>
    </div>
    <nav class="top-bar-nav">
      <a href="index.html"     class="top-nav-link">&#128506; Map</a>
      <a href="locations.html" class="top-nav-link">&#128203; Locations</a>
      <a href="directory.html" class="top-nav-link active">&#128196; Directory</a>
    </nav>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="detail-layout" id="detail-layout">

    <!-- LEFT: full-height Leaflet map -->
    <div class="detail-map-pane">
      <div id="detail-map"></div>
      <div class="map-drag-hint" id="drag-hint">&#128205; Drag pin to correct its position</div>
    </div>

    <!-- RIGHT: info panel -->
    <div class="detail-info-pane" id="info-pane">

      <!-- Not-found fallback (hidden once a location loads) -->
      <div class="not-found" id="not-found" style="display:none;">
        <div class="icon">&#128205;</div>
        <h2>Location not found</h2>
        <p>No location matches that ID.<br/>It may have been deleted.</p>
        <a href="directory.html" class="btn-secondary">&#8592; Back to Directory</a>
      </div>

      <!-- Info content (hidden until a location loads) -->
      <div class="detail-info-scroll" id="info-content" style="display:none;">

        <!-- Name + type badge -->
        <div>
          <h1 class="detail-name" id="d-name">-</h1>
          <div id="d-type-badge"></div>
        </div>

        <hr class="detail-divider" />

        <!-- Address -->
        <div class="detail-field">
          <div class="detail-label">Address</div>
          <div class="detail-value" id="d-address">-</div>
        </div>

        <!-- County -->
        <div class="detail-field" id="d-county-row">
          <div class="detail-label">County</div>
          <div class="detail-value" id="d-county">-</div>
        </div>

        <!-- Voting Hours -->
        <div class="detail-field" id="d-hours-row">
          <div class="detail-label">Voting Hours</div>
          <div class="detail-value" id="d-hours">-</div>
        </div>

        <hr class="detail-divider" />

        <!-- Districts -->
        <div class="detail-field">
          <div class="detail-label">Districts</div>
          <div class="dist-chips" id="d-districts"></div>
        </div>

        <hr class="detail-divider" />

        <!-- Notes -->
        <div class="detail-field" id="d-notes-row" style="display:none;">
          <div class="detail-label">Notes</div>
          <div class="detail-value" id="d-notes">-</div>
        </div>

        <!-- Coordinates - updates live when pin is dragged -->
        <div class="detail-field">
          <div class="detail-label">Pin Coordinates</div>
          <div class="coords-value" id="d-coords">-</div>
          <div id="coords-saved-msg">&#10003; Position saved</div>
        </div>

      </div><!-- end #info-content -->

      <!-- Footer action buttons -->
      <div class="detail-footer" id="detail-footer" style="display:none;">
        <button class="btn-danger" id="btn-delete">&#128465; Delete</button>
        <button class="btn-primary" id="btn-edit">&#9998; Edit</button>
      </div>

    </div><!-- end .detail-info-pane -->

  </div><!-- end .detail-layout -->

  <!-- Edit panel overlay + slide-in form -->
  <div class="panel-overlay" id="panel-overlay"></div>
  <div class="edit-panel" id="edit-panel">
    <div class="ep-header">
      <h3>Edit Location</h3>
      <button class="ep-close" id="ep-close">&#10005;</button>
    </div>
    <div class="ep-body">
      <div class="fp-group"><label>Location Name *</label><input type="text" id="ep-name" /></div>
      <div class="fp-group"><label>Street Address</label><input type="text" id="ep-address" /><div id="ep-geo-status" class="inline-status"></div></div>
      <div class="fp-group"><label>City</label><input type="text" id="ep-city" /></div>
      <div class="fp-group">
        <label>County</label>
        <select id="ep-county">
          <option value="">Select county...</option>
          <option>Anderson</option><option>Bedford</option><option>Benton</option><option>Bledsoe</option><option>Blount</option><option>Bradley</option><option>Campbell</option><option>Cannon</option><option>Carroll</option><option>Carter</option><option>Cheatham</option><option>Chester</option><option>Claiborne</option><option>Clay</option><option>Cocke</option><option>Coffee</option><option>Crockett</option><option>Cumberland</option><option>Davidson</option><option>Decatur</option><option>DeKalb</option><option>Dickson</option><option>Dyer</option><option>Fayette</option><option>Fentress</option><option>Franklin</option><option>Gibson</option><option>Giles</option><option>Grainger</option><option>Greene</option><option>Grundy</option><option>Hamblen</option><option>Hamilton</option><option>Hancock</option><option>Hardeman</option><option>Hardin</option><option>Hawkins</option><option>Haywood</option><option>Henderson</option><option>Henry</option><option>Hickman</option><option>Houston</option><option>Humphreys</option><option>Jackson</option><option>Jefferson</option><option>Johnson</option><option>Knox</option><option>Lake</option><option>Lauderdale</option><option>Lawrence</option><option>Lewis</option><option>Lincoln</option><option>Loudon</option><option>McMinn</option><option>McNairy</option><option>Macon</option><option>Madison</option><option>Marion</option><option>Marshall</option><option>Maury</option><option>Meigs</option><option>Monroe</option><option>Montgomery</option><option>Moore</option><option>Morgan</option><option>Obion</option><option>Overton</option><option>Perry</option><option>Pickett</option><option>Polk</option><option>Putnam</option><option>Rhea</option><option>Roane</option><option>Robertson</option><option>Rutherford</option><option>Scott</option><option>Sequatchie</option><option>Sevier</option><option>Shelby</option><option>Smith</option><option>Stewart</option><option>Sullivan</option><option>Sumner</option><option>Tipton</option><option>Trousdale</option><option>Unicoi</option><option>Union</option><option>Van Buren</option><option>Warren</option><option>Washington</option><option>Wayne</option><option>Weakley</option><option>White</option><option>Williamson</option><option>Wilson</option>
        </select>
      </div>
      <div class="fp-group">
        <label>Location Type *</label>
        <div class="type-radios">
          <label class="type-radio" id="ep-radio-early"><input type="radio" name="ep-type" value="early" /> &#11044; Early Voting</label>
          <label class="type-radio" id="ep-radio-election"><input type="radio" name="ep-type" value="election_day" checked /> &#11044; Election Day</label>
        </div>
      </div>
      <div class="fp-group">
        <label>Districts</label>
        <div class="fp-grid-3">
          <div class="fp-group"><label>House</label><input type="number" id="ep-house" placeholder="auto" min="1" max="99" /></div>
          <div class="fp-group"><label>Senate</label><input type="number" id="ep-senate" placeholder="auto" min="1" max="33" /></div>
          <div class="fp-group"><label>Congress</label><input type="number" id="ep-congress" placeholder="auto" min="1" max="9" /></div>
        </div>
        <div id="ep-dist-status" class="inline-status"></div>

      <div class="fp-group">
        <label>Voting Hours</label>

          <div class="fp-group"><label>Opens</label><select id="ep-hours-open"></select></div>
          <div class="fp-group"><label>Closes</label><select id="ep-hours-close"></select></div>
        </div>

        <label>Coordinates</label>
        <div class="fp-grid-2">
          <div class="fp-group"><label>Lat</label><input type="number" id="ep-lat" step="0.00001" /></div>
          <div class="fp-group"><label>Lng</label><input type="number" id="ep-lng" step="0.00001" /></div>
        </div>
      </div>
    </div>
    <div class="ep-footer">
      <button class="btn-secondary" id="ep-cancel">Cancel</button>
      <button class="btn-primary" id="ep-save" style="flex:1;">Save Location</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Base polling data -->
  <script src="data/polling-locations.js"></script>

  <script>
    // =========================================================================
    // DATA: merge seed data + custom locations from localStorage
    // =========================================================================
    function loadCustom() {
      try { return JSON.parse(localStorage.getItem("tn_polling_custom") || "[]"); }
      catch(e) { return []; }
    }
    function saveCustom(arr) {
      localStorage.setItem("tn_polling_custom", JSON.stringify(arr));
    }

    var ALL_LOCATIONS = POLLING_LOCATIONS.concat(loadCustom());

    // =========================================================================
    // PARSE URL: ?id=some-location-id
    // =========================================================================
    var params = new URLSearchParams(window.location.search);
    var locId  = params.get("id");
    var loc    = ALL_LOCATIONS.find(function(l) { return l.id === locId; });

    // =========================================================================
    // SHOW NOT FOUND if ID missing or location deleted
    // =========================================================================
    if (!loc) {
      document.getElementById("not-found").style.display  = "flex";
      document.getElementById("info-content").style.display = "none";
      document.getElementById("detail-footer").style.display = "none";
      // Still initialize a bare map centered on Tennessee
      initEmptyMap();
    } else {
      populateInfo(loc);
      initDetailMap(loc);
    }

    // =========================================================================
    // POPULATE INFO PANEL
    // =========================================================================
    function populateInfo(loc) {
      var isCustom = loadCustom().some(function(l) { return l.id === loc.id; });
      var isEarly  = loc.type === "early";

      // Page title (top bar)
      document.title = (loc.name || "Location") + " - TN Polling Locations";
      document.getElementById("page-title").textContent = loc.name || "Location";

      // Name
      document.getElementById("d-name").textContent = loc.name || "Unnamed Location";

      // Type badge
      var badgeClass = isCustom ? "custom" : (isEarly ? "early" : "eday");
      var badgeLabel = isCustom ? "Custom" : (isEarly ? "Early Voting" : "Election Day");
      var dot        = isCustom ? "#9b30ff" : (isEarly ? "#10b981" : "#f59e0b");
      document.getElementById("d-type-badge").innerHTML =
        '<span class="type-badge ' + badgeClass + '">' +
          '<span style="width:8px;height:8px;border-radius:50%;background:' + dot + ';display:inline-block;"></span>' +
          badgeLabel +
        '</span>';

      // Address
      var addrEl = document.getElementById("d-address");
      addrEl.textContent = loc.address
        ? loc.address + (loc.city ? ", " + loc.city + ", TN" : ", TN")
        : "Address not on file";
      if (!loc.address) addrEl.classList.add("muted");

      // County
      if (loc.county) {
        document.getElementById("d-county").textContent = loc.county + " County";
      } else {
        document.getElementById("d-county-row").style.display = "none";
      }

      // Hours
      if (loc.hours) {
        document.getElementById("d-hours").textContent = loc.hours;
      } else {
        document.getElementById("d-hours-row").style.display = "none";
      }

      // Districts
      var distDefs = [
        { label: "State House",    val: loc.state_district },
        { label: "State Senate",   val: loc.state_senate_district },
        { label: "Congressional",  val: loc.congressional_district }
      ].filter(function(d) { return d.val && d.val !== "?"; });

      var chipsEl = document.getElementById("d-districts");
      if (distDefs.length) {
        chipsEl.innerHTML = distDefs.map(function(d) {
          return '<div class="dist-chip">' +
            '<span class="chip-label">' + d.label + '</span>' +
            '<span class="chip-num">D' + d.val + '</span>' +
          '</div>';
        }).join("");
      } else {
        chipsEl.innerHTML = '<span style="font-size:0.82rem;color:var(--text-muted);">No district data on file</span>';
      }

      // Notes
      if (loc.notes) {
        document.getElementById("d-notes").textContent = loc.notes;
        document.getElementById("d-notes-row").style.display = "";
      }

      // Coordinates (initial - updated live when pin is dragged)
      updateCoordsDisplay(loc.lat, loc.lng);

      // Show info + footer
      document.getElementById("info-content").style.display  = "flex";
      document.getElementById("detail-footer").style.display = "flex";

      // Edit button - opens the slide-in edit panel
      document.getElementById("btn-edit").addEventListener("click", function() { openEditPanel(loc); });

      // Delete button - only meaningful for custom locations
      var btnDelete = document.getElementById("btn-delete");
      if (isCustom) {
        btnDelete.addEventListener("click", function() {
          if (!confirm('Delete "' + (loc.name || "this location") + '"? This cannot be undone.')) return;
          var custom = loadCustom().filter(function(l) { return l.id !== loc.id; });
          saveCustom(custom);
          window.location.href = "directory.html";
        });
      } else {
        // Seed data - cannot delete from this page
        btnDelete.innerHTML    = "&#128196; Seed Data";
        btnDelete.title        = "This is placeholder seed data - edit in data/polling-locations.js";
        btnDelete.style.cursor = "default";
        btnDelete.style.opacity = "0.45";
        btnDelete.disabled     = true;
      }
    }

    // Updates the coordinates display in the info panel
    function updateCoordsDisplay(lat, lng) {
      var el = document.getElementById("d-coords");
      if (lat && lng) {
        el.textContent = parseFloat(lat).toFixed(5) + ", " + parseFloat(lng).toFixed(5);
      } else {
        el.textContent = "Not set";
      }
    }

    // =========================================================================
    // EMPTY MAP (shown when location not found)
    // =========================================================================
    function initEmptyMap() {
      var map = L.map("detail-map", { scrollWheelZoom: true })
        .setView([35.85, -86.35], 7);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors", maxZoom: 19
      }).addTo(map);
    }

    // =========================================================================
    // DETAIL MAP - full-height Leaflet map with draggable pin
    // =========================================================================
    function initDetailMap(loc) {
      var startLat = loc.lat && loc.lat !== 35.5 ? loc.lat : 35.85;
      var startLng = loc.lng && loc.lng !== -86.5 ? loc.lng : -86.35;
      var hasCoords = loc.lat && loc.lat !== 35.5;

      var map = L.map("detail-map", {
        center:          [startLat, startLng],
        zoom:            hasCoords ? 17 : 7,
        scrollWheelZoom: true
      });

      // Street layer
      var streetLayer = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        { attribution: "&copy; OpenStreetMap contributors", maxZoom: 19 }
      );

      // Satellite layer - default (useful at street level zoom)
      var satLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Tiles &copy; Esri", maxZoom: 19 }
      );

      satLayer.addTo(map);

      // Layer toggle top-right
      L.control.layers(
        { "Street": streetLayer, "Satellite": satLayer },
        {},
        { position: "topright", collapsed: false }
      ).addTo(map);

      // If no valid coordinates, try to geocode the address first
      if (!hasCoords && loc.address) {
        geocodeAndPlace(map, loc);
        return;
      }

      if (hasCoords) {
        placePin(map, loc, startLat, startLng);
      }
    }

    // -------------------------------------------------------------------------
    // placePin(map, loc, lat, lng)
    // Adds a draggable purple pin. On drag end, saves new coords to
    // the custom locations array in localStorage and updates the display.
    // -------------------------------------------------------------------------
    function placePin(map, loc, lat, lng) {
      var pinIcon = L.divIcon({
        className: "",
        html: '<div style="width:22px;height:22px;border-radius:50%;' +
              'background:#9b30ff;border:3px solid #ffffff;' +
              'box-shadow:0 2px 8px rgba(0,0,0,0.6);"></div>',
        iconSize:   [22, 22],
        iconAnchor: [11, 11]
      });

      var marker = L.marker([lat, lng], {
        icon:      pinIcon,
        draggable: true,
        title:     "Drag to correct position"
      }).addTo(map);

      // Hide the drag hint after 4 seconds
      setTimeout(function() {
        var hint = document.getElementById("drag-hint");
        if (hint) hint.classList.add("hidden");
      }, 4000);

      // Drag end - save updated coordinates
      marker.on("dragend", function() {
        var pos = marker.getLatLng();

        // Update coords display immediately
        updateCoordsDisplay(pos.lat, pos.lng);

        // Save to custom locations in localStorage
        var custom = loadCustom();
        var idx    = custom.findIndex(function(l) { return l.id === loc.id; });
        if (idx !== -1) {
          // This is a custom location - update it directly
          custom[idx].lat = pos.lat;
          custom[idx].lng = pos.lng;
          saveCustom(custom);
        } else {
          // Seed location - save position override in a separate key so
          // the original data file is not modified
          var overrides = {};
          try { overrides = JSON.parse(localStorage.getItem("tn_polling_overrides") || "{}"); } catch(e) {}
          overrides[loc.id] = { lat: pos.lat, lng: pos.lng };
          localStorage.setItem("tn_polling_overrides", JSON.stringify(overrides));
        }

        // Flash the save confirmation
        var msg = document.getElementById("coords-saved-msg");
        msg.style.display = "block";
        setTimeout(function() { msg.style.display = "none"; }, 2500);
      });
    }

    // -------------------------------------------------------------------------
    // geocodeAndPlace(map, loc)
    // Nominatim geocode as a fallback when the location has no coordinates.
    // -------------------------------------------------------------------------
    function geocodeAndPlace(map, loc) {
      var hint = document.getElementById("drag-hint");
      if (hint) hint.textContent = "Locating address...";

      var query = loc.address + (loc.city ? ", " + loc.city : "") + ", TN";
      var url   = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
                  encodeURIComponent(query);

      fetch(url, { headers: { "Accept-Language": "en" } })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data && data[0]) {
            var lat = parseFloat(data[0].lat);
            var lng = parseFloat(data[0].lon);
            map.setView([lat, lng], 17);
            updateCoordsDisplay(lat, lng);
            placePin(map, loc, lat, lng);
            if (hint) hint.textContent = "&#128205; Approximate - drag pin to correct";
          } else {
            if (hint) hint.textContent = "Address not found - location unknown";
          }
        })
        .catch(function() {
          if (hint) hint.textContent = "Could not geocode address";
        });
    }
    // =========================================================================
    // EDIT PANEL
    // =========================================================================

    // Build time dropdown options (6am to 9pm, 30-min steps)
    (function() {
      var opens = document.getElementById("ep-hours-open");
      var closes = document.getElementById("ep-hours-close");
      for (var h = 6; h <= 21; h++) {
        for (var m = 0; m < 60; m += 30) {
          var period = h < 12 ? "am" : "pm";
          var h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
          var label = h12 + ":" + (m === 0 ? "00" : "30") + period;
          var o = document.createElement("option"); o.value = label; o.textContent = label; opens.appendChild(o);
          var c = document.createElement("option"); c.value = label; c.textContent = label; closes.appendChild(c);
        }
      }
      opens.value = "8:00am"; closes.value = "7:00pm";
    })();

    function epGetHours() {
      return document.getElementById("ep-hours-open").value + " - " + document.getElementById("ep-hours-close").value;
    }
    function epSetHours(str) {
      if (!str) return;
      var parts = str.split(/\s*-\s*/);
      if (parts.length !== 2) return;
      function norm(t) { t = t.trim().toLowerCase().replace(/\s/g,""); if (!t.includes(":")) t = t.replace(/(am|pm)/,":00$1"); return t; }
      var opens = document.getElementById("ep-hours-open"); var closes = document.getElementById("ep-hours-close");
      var ov = norm(parts[0]); var cv = norm(parts[1]);
      if (Array.from(opens.options).some(function(o){return o.value===ov;}))   opens.value  = ov;
      if (Array.from(closes.options).some(function(o){return o.value===cv;}))  closes.value = cv;
    }
    function epUpdateTypeStyles() {
      var val = document.querySelector('input[name="ep-type"]:checked').value;
      document.getElementById("ep-radio-early").className    = "type-radio" + (val === "early"        ? " sel-early"    : "");
      document.getElementById("ep-radio-election").className = "type-radio" + (val === "election_day" ? " sel-election" : "");
    }
    document.querySelectorAll('input[name="ep-type"]').forEach(function(r) { r.addEventListener("change", epUpdateTypeStyles); });

    function epShowStatus(id, msg, color, bg) { var e=document.getElementById(id); e.textContent=msg; e.style.color=color; e.style.background=bg; e.style.display="block"; }
    function epHideStatus(id) { var e=document.getElementById(id); e.style.display="none"; e.textContent=""; }

    function openEditPanel(locObj) {
      document.getElementById("ep-name").value    = locObj.name    || "";
      document.getElementById("ep-address").value = locObj.address || "";
      document.getElementById("ep-city").value    = locObj.city    || "";
      document.getElementById("ep-county").value  = locObj.county  || "";
      document.getElementById("ep-notes").value   = locObj.notes   || "";
      document.getElementById("ep-house").value   = locObj.state_district            || "";
      document.getElementById("ep-senate").value  = locObj.state_senate_district     || "";
      document.getElementById("ep-congress").value= locObj.congressional_district    || "";
      document.getElementById("ep-lat").value     = locObj.lat || "";
      document.getElementById("ep-lng").value     = locObj.lng || "";
      document.getElementById("ep-hours-open").value = "8:00am";
      document.getElementById("ep-hours-close").value = "7:00pm";
      if (locObj.hours) epSetHours(locObj.hours);
      var typeVal = locObj.type || "election_day";
      document.querySelector('input[name="ep-type"][value="early"]').checked        = typeVal === "early";
      document.querySelector('input[name="ep-type"][value="election_day"]').checked = typeVal === "election_day";
      epUpdateTypeStyles();
      epHideStatus("ep-geo-status"); epHideStatus("ep-dist-status");
      document.getElementById("edit-panel").classList.add("open");
      document.getElementById("panel-overlay").classList.add("visible");
      setTimeout(function() { document.getElementById("ep-name").focus(); }, 100);
    }

    function closeEditPanel() {
      document.getElementById("edit-panel").classList.remove("open");
      document.getElementById("panel-overlay").classList.remove("visible");
    }

    document.getElementById("ep-close").addEventListener("click", closeEditPanel);
    document.getElementById("ep-cancel").addEventListener("click", closeEditPanel);
    document.getElementById("panel-overlay").addEventListener("click", closeEditPanel);

    document.getElementById("ep-save").addEventListener("click", function() {
      var name = document.getElementById("ep-name").value.trim();
      if (!name) { alert("Location name is required."); return; }
      var lat = parseFloat(document.getElementById("ep-lat").value);
      var lng = parseFloat(document.getElementById("ep-lng").value);
      var updated = {
        id: loc.id, name: name,
        address: document.getElementById("ep-address").value.trim(),
        city: document.getElementById("ep-city").value.trim(),
        county: document.getElementById("ep-county").value,
        type: document.querySelector('input[name="ep-type"]:checked').value,
        state_district: document.getElementById("ep-house").value    || "?",
        state_senate_district: document.getElementById("ep-senate").value   || "?",
        congressional_district: document.getElementById("ep-congress").value || "?",
        hours: epGetHours(),
        notes: document.getElementById("ep-notes").value.trim(),
        lat: isNaN(lat) ? (loc.lat || 35.5) : lat,
        lng: isNaN(lng) ? (loc.lng || -86.5) : lng
      };

      // Save to localStorage - update existing custom entry or add new one
      var saved = loadCustom();
      var idx = saved.findIndex(function(l) { return l.id === loc.id; });
      if (idx !== -1) { saved[idx] = updated; } else { saved.push(updated); }
      saveCustom(saved);

      // Refresh the info panel with the new values and close the edit panel
      loc = updated;
      populateInfo(updated);
      closeEditPanel();
    });

    // Geocoding for the edit panel
    var epGeoTimer = null;
    function epScheduleGeocode() {
      clearTimeout(epGeoTimer);
      var addr = document.getElementById("ep-address").value.trim();
      if (!addr) return;
      epGeoTimer = setTimeout(function() {
        var city = document.getElementById("ep-city").value.trim();
        epShowStatus("ep-geo-status", "Finding address...", "#60a5fa", "rgba(30,58,95,0.5)");
        fetch("https://nominatim.openstreetmap.org/search?q=" + encodeURIComponent(addr + (city ? ", " + city : "") + ", TN") +
          "&format=json&limit=1&countrycodes=us&addressdetails=1",
          { headers: { "User-Agent": "TN-Polling-Locations-Map/1.0" } })
        .then(function(r) { return r.json(); })
        .then(function(results) {
          if (!results || !results.length) {
              epShowStatus("ep-geo-status", "Not found - scroll down to enter coordinates manually", "#f59e0b", "rgba(120,53,15,0.3)");
              // Highlight the coordinate inputs and scroll to them so the user can see where to type
              var latInput = document.getElementById("ep-lat");
              var lngInput = document.getElementById("ep-lng");
              latInput.style.borderColor = "#f59e0b";
              lngInput.style.borderColor = "#f59e0b";
              setTimeout(function() {
                latInput.scrollIntoView({ behavior: "smooth", block: "center" });
                latInput.focus();
              }, 200);
              // Clear the highlight once the user starts typing
              function clearHighlight() {
                latInput.style.borderColor = "";
                lngInput.style.borderColor = "";
                latInput.removeEventListener("input", clearHighlight);
                lngInput.removeEventListener("input", clearHighlight);
              }
              latInput.addEventListener("input", clearHighlight);
              lngInput.addEventListener("input", clearHighlight);
              return;
            }
          document.getElementById("ep-lat").value = parseFloat(results[0].lat).toFixed(6);
          document.getElementById("ep-lng").value = parseFloat(results[0].lon).toFixed(6);
          if (!document.getElementById("ep-county").value && results[0].address && results[0].address.county) {
            var raw = results[0].address.county.replace(/ County$/i, "").trim();
            var match = Array.from(document.getElementById("ep-county").options).find(function(o) { return o.value.toLowerCase() === raw.toLowerCase(); });
            if (match) document.getElementById("ep-county").value = match.value;
          }
          epShowStatus("ep-geo-status", "Address found", "#10b981", "rgba(6,78,59,0.3)");
          setTimeout(function() { epHideStatus("ep-geo-status"); }, 3000);
        })
        .catch(function() { epShowStatus("ep-geo-status", "Geocode failed", "#f87171", "rgba(69,10,10,0.3)"); });
      }, 800);
    }
    document.getElementById("ep-address").addEventListener("input", epScheduleGeocode);
    document.getElementById("ep-city").addEventListener("input", epScheduleGeocode);

  </script>

</body>
</html>
